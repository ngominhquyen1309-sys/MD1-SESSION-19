<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="baitap2-ss19.css">
</head>

<body>
    <div class="container">
        <form id="form">
            <h1>Task Management</h1>
            <div>
                <input class="ipContent" type="text" name="Content" placeholder="Content">
                <input class="ipDate" type="date" name="Due Date">
                <select class="chooseStatus" name="Status">
                    <option selected>Choose Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
                <input class="asignedTo" type="text" name="Asigned to" placeholder="Username">
                <button class="btnSubmit" type="button">Submit</button>
            </div>
        </form>
        <div id="table-container">
        <table border="2px">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Content</th>
                    <th>Due date</th>
                    <th>Status</th>
                    <th>Asigned to</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>
        </div>
    </div>
    <script src="baitap2-ss19.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="baitap3-ss19.css">
</head>

<body>
    <div class= "form-container">
        <h2>Login</h2>
        <form id="form">
            <label>Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email"><br />
            <small class="error error-email"></small>
            <div class="password-container">
                <label>Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"><br />
                <button type="button" id="togglePassword">👁</button>
                <small class="error error-password"></small>
            </div>
            <button id="btnLogin">Login</button>

            <span><a src="">Forgot pasword</a> or <a src="">SignUp</a></span>
        </form>
    </div>
    <script src="baitap3-ss19.js"></script>
</body>

</html>
